<!DOCTYPE html>
<html lang="en">
<head>
    <title>Food Blog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            font-family:Arial, Helvetica, sans-serif;
        }
        #leftside {
            float:left;
            width: 30%;
            min-height: 1200px;
            background-color:rgb(77, 192, 154);
        }
        #rightside {
            float:left;
            width: 70%;
            min-height: 1200px;
            background-color:rgb(238, 226, 192);
            position:relative;
        }
        #container {
            background-color:rgba(255, 255, 255, 0.85);
            position: absolute;
            top: 15%;
            left: 15%;
            min-width: 1100px;
            min-height: 1050px;
            border-radius: 0.7em;
        }
        header {
            height: 50px;
            background-color:rgba(231, 229, 229, 0.5);
            font-size: 2.75em;
            padding:0.5em;
            color:rgb(216, 150, 7);
        }
        header span {
            font-family: 'Sacramento', cursive;
        }
        main {
            position: relative;
        }
        main h2 {
            position: absolute;
            left: 20%;
            top: 30px;
            margin: 25px 0 200px 50px;
            color:rgb(60, 190, 160);
            text-transform: uppercase;
        }
        main #photos img {
            margin: 0.75em;
            border: 0.85em solid rgb(255, 255, 255);
        }
        section#blogposts {
            position: absolute;
            left: 20%;
            top: 70px;
            padding: 50px;
        }
        main .post {
            margin: 25px;
            padding: 25px;
            border: 2px solid rgba(83, 78, 58, 0.6);
            border-radius: 0.5em;
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .profile-thumb {
            border-radius: 50%;
            border: 2px solid rgb(60, 190, 160);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .profile-thumb:hover {
            transform: scale(1.06);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.22);
        }
        .author-card-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .author-card {
            width: 420px;
            max-width: 90%;
            background: linear-gradient(145deg, #ffffff, #f6fbf8);
            border: 2px solid rgb(60, 190, 160);
            border-radius: 12px;
            box-shadow: 0 18px 30px rgba(0, 0, 0, 0.28);
            padding: 22px;
            position: relative;
        }
        .author-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: rgb(45, 128, 108);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .author-card p {
            margin: 8px 0;
            line-height: 1.45;
        }
        .author-card .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background-color: rgb(216, 150, 7);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 1.05em;
            cursor: pointer;
        }
        .author-card .close-btn:hover {
            background-color: rgb(187, 128, 5);
        }
        footer {
            position: absolute;
            bottom: 0;
            height: 50px;
            width: 100%;
            text-align: center;
            font-size: 0.85em;
        }
    </style>

</head>
<body>
    <aside id="leftside"></aside>
    <aside id="rightside"></aside>

    <!-- ═══ Vue Instance ═════════════════════════════════════════════════════════ -->
    <div id="container">

        <blog-header :title="header.title"></blog-header>

        <main>
            <aside id="photos">
                <img :src="photo.src" :alt="photo.alt" :width="photo.width">
            </aside>

            <h2>Comments</h2>

            <section id="blogposts">
                <blog-post
                    v-for="post in posts"
                    :key="post.id"
                    :post="post"
                    :profile-src="profilePlaceholder.src"
                    :on-profile-click="openAuthorCard">
                </blog-post>
            </section>
        </main>

        <div class="author-card-backdrop" v-if="selectedAuthor" @click.self="closeAuthorCard">
            <div class="author-card">
                <button class="close-btn" @click="closeAuthorCard" aria-label="Close">&times;</button>
                <h3>{{ selectedAuthor }}</h3>
                <p><strong>Foodie Level:</strong> {{ selectedAuthorInfo.level }}</p>
                <p><strong>Bio:</strong> {{ selectedAuthorInfo.bio }}</p>
            </div>
        </div>

        <blog-footer :text="footer.text"></blog-footer>

    </div>

    <script>
        // ─── Components ──────────────────────────────────────────────────────────────────

        // Header component
        Vue.component('blog-header', {
            props: ['title'],
            template: `<header><span>{{ title }}</span></header>`
        });

        // Single post component
        Vue.component('blog-post', {
            props: ['post', 'profileSrc', 'onProfileClick'],
            template: `
                <div class="post">
                    <div class="post-header">
                        <img
                            class="profile-thumb"
                            :src="profileSrc"
                            :alt="post.author + ' profile image'"
                            width="54"
                            height="54"
                            @click="onProfileClick(post.author)">
                        <div>
                            <span class="author">{{ post.author }}</span> &mdash;
                            <span class="date">{{ post.date }}</span>
                            <span class="reply">REPLY</span>
                        </div>
                    </div>
                    <p>{{ post.content }}</p>
                </div>
            `
        });

        // Footer component
        Vue.component('blog-footer', {
            props: ['text'],
            template: `<footer>&copy; {{ text }}</footer>`
        });

        // ─── Vue Instance ──────────────────────────────────────────────────────────────────
        new Vue({
            el: '#container',
            data: {
                header: {
                    title: 'Food Blog'
                },
                photo: {
                    src: 'images/chili.jpg',
                    alt: 'White Chicken Chili',
                    width: 180
                },
                profilePlaceholder: {
                    src: 'images/profile.png'
                },
                footer: {
                    text: 'Copyright FOOD BLOG'
                },
                selectedAuthor: '',
                authorInfo: {
                    'Brianna': {
                        level: 'Novice',
                        bio: 'Food enthusiast. Love to cook and experiment. Into only organic, fat free, sugar free stuffs!'
                    },
                    'LINH': {
                        level: 'Newcomer',
                        bio: 'Love food! Grew up with meat and potatoes. Recently venture outside my comfort zone. Loving everything I have been eating so far. Thai is my favorite at this time.'
                    },
                    'CATHERINE LEONARDO': {
                        level: 'Mentor',
                        bio: 'I have to say I never was the adventurous type until 2 years ago. My boyfriend, who is of Japanese background, exposed me to other cultural food and I have never look back since!'
                    },
                    'KALI': {
                        level: 'Novice',
                        bio: "Food is my passion. So is cooking. I love to experiment and try new things. I have to admit I'm a food whore! Invite me over for dinner and I'll be there!"
                    }
                },
                posts: [
                    {
                        id: 1,
                        author: 'Brianna',
                        date: 'February 18, 2021 @ 3:30 pm',
                        content: "Was amazing! My Walmart didn't have coriander in stock and didn't have ground cumin. I used serrano instead of jalapeño. It was just like my favorite tortilla soup from BJs. I am sending this recipe to my family. I want everyone to try it!"
                    },
                    {
                        id: 2,
                        author: 'LINH',
                        date: 'February 15, 2021 @ 9:46 am',
                        content: "I just made this soup today and it's so tasty! Didn't have corn at home but still turned out very good. It's a winner! I made beef chili for my parents; but since my dad has gout he can't eat beef; this white chicken chili is perfect for him. Thank you Lisa!"
                    },
                    {
                        id: 3,
                        author: 'CATHERINE LEONARDO',
                        date: 'February 13, 2021 @ 12:58 pm',
                        content: "I LOVE this White Chicken Chili! You are right, it is a satiating meal — delicious with toasted bread. Refreshingly different taste than any chicken chili I've made in the past. I made it exactly as written and added some chopped zucchini, carrots, and celery. Instead of shredding the chicken, I chopped it into small pieces. It freezes very well. Will be an all-time favorite, for sure."
                    },
                    {
                        id: 4,
                        author: 'KALI',
                        date: 'February 13, 2021 @ 11:31 am',
                        content: "This recipe is dynamite! My partner usually won't eat beans but he finished the whole pot (darn was hoping to have some for leftovers haha). This is a crowd-pleaser that I am going to add to my regular recipe rotation. Thanks so much, Lisa!"
                    }
                ]
            },
            computed: {
                selectedAuthorInfo: function() {
                    return this.authorInfo[this.selectedAuthor] || {
                        level: 'Unknown',
                        bio: 'No bio available.'
                    };
                }
            },
            methods: {
                openAuthorCard: function(authorName) {
                    this.selectedAuthor = authorName;
                },
                closeAuthorCard: function() {
                    this.selectedAuthor = '';
                }
            }
        });
    </script>

</body>
</html>
