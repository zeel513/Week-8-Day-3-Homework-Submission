<!DOCTYPE html>
<html lang="en">
<head>
    <title>Food Blog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="foodblog.css">

</head>
<body>
    <div id="app" class="py-4">
        <div class="container">
            <div class="card border-0 shadow-lg">

                <blog-header :title="header.title" :nav-items="header.navItems"></blog-header>

                <main class="card-body p-4 p-lg-5">
                    <div class="row">
                        <aside class="col-lg-3 mb-4 mb-lg-0 text-center text-lg-left">
                            <img class="img-fluid rounded shadow-sm food-photo" :src="photo.src" :alt="photo.alt">
                        </aside>

                        <section class="col-lg-9">
                            <h2 class="comments-title">Comments</h2>

                            <blog-post
                                v-for="post in posts"
                                :key="post.id"
                                :post="post"
                                :profile-src="profilePlaceholder.src"
                                :on-profile-click="openAuthorCard">
                            </blog-post>
                        </section>
                    </div>
                </main>

                <div class="author-card-backdrop" v-if="selectedAuthor" @click.self="closeAuthorCard">
                    <div class="author-card">
                        <button class="close-btn" @click="closeAuthorCard" aria-label="Close">&times;</button>
                        <h3>{{ selectedAuthor }}</h3>
                        <p><strong>Foodie Level:</strong> {{ selectedAuthorInfo.level }}</p>
                        <p><strong>Bio:</strong> {{ selectedAuthorInfo.bio }}</p>
                    </div>
                </div>

                <blog-footer :text="footer.text"></blog-footer>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
    <script src="foodblog.js"></script>

</body>
</html>
